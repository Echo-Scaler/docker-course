apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: production
data:
  APP_NAME: "LaravelProduction"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://mylaravelapp.com"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "laravel_db"
  DB_USERNAME: "laravel_user"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: laravel-secrets
  namespace: production
type: Opaque
stringData:
  APP_KEY: "base64:AbCdEfGhIjKlMnOpQrStUvWxYz0123456789+ABCDEF="
  DB_PASSWORD: "ProdSecureUserPassword456!"
  MYSQL_ROOT_PASSWORD: "ProdSecureRootPassword789!"
